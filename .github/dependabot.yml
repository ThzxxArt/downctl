version: 2

# GitHub Actions are pinned to commit SHAs rather than tags: a tag can be moved
# to point at different code, a SHA cannot. The pin only stays current if
# something updates it, which is what this entry is for — Dependabot rewrites
# the SHA and keeps the ``# vN`` comment next to it.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
