[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downctl"
dynamic = ["version"]
description = "A plugin-based universal command-line downloader with resumable, multi-connection accelerated and self-healing downloads."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ThzxxArt" }]
keywords = [
    "downloader",
    "cli",
    "resume",
    "async",
    "aiohttp",
    "huggingface",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
    # ``py.typed`` ships in the wheel; say so, or type checkers ignore it.
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
sftp = [
    "asyncssh>=2.14",
]
completion = [
    "argcomplete>=3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # `[tool.coverage.run] patch = ["subprocess"]` merges child-process data
    # into a branch-measured parent. pytest-cov 5 hands the child a
    # statement-only configuration, so `pytest --cov` dies with
    # "Can't combine statement coverage data with branch data" (reproduced).
    "pytest-cov>=6",
    # `[tool.coverage.run] patch = ["subprocess"]` does nothing before coverage
    # 7.6: the key is accepted and silently ignored, so the subprocess entry
    # point looked measured while nothing was recorded. Pinned here and asserted
    # in CI (`coverage debug config`), because a gate that cannot fail is worse
    # than no gate.
    "coverage>=7.10",
    "pytest-timeout>=2",
    "mypy>=1.10",
    "ruff>=0.5",
    # The documented release gate runs `twine check dist/*` (RELEASING.md and
    # release.yml). Without twine in the dev extra, a `pip install -e '.[dev]'`
    # environment cannot run that gate and the step is silently skipped.
    "twine>=5",
    # The TLS integration test mints its own self-signed certificate for
    # 127.0.0.1. cryptography is also pulled in by the optional sftp extra, but
    # the dev suite must not depend on that extra being installed.
    "cryptography>=42",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "genbadge[coverage]>=1.1",
]

[project.urls]
Homepage = "https://github.com/ThzxxArt/downctl"
Documentation = "https://thzxxart.github.io/downctl/"
Repository = "https://github.com/ThzxxArt/downctl"
Issues = "https://github.com/ThzxxArt/downctl/issues"
Changelog = "https://github.com/ThzxxArt/downctl/blob/master/CHANGELOG.md"

[project.scripts]
downctl = "downctl.cli:main"

[tool.hatch.version]
path = "src/downctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/downctl"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/README.en.md",
    "/CHANGELOG.md",
    "/LICENSE",
    # Without these the sdist contains `docs/` but cannot build it: `mkdocs.yml`
    # is the build definition, and the governance files are what the project
    # promises a source-tarball user can read.
    "/mkdocs.yml",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/RELEASING.md",
    "/CODE_OF_CONDUCT.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "ASYNC"]
ignore = [
    "E501",
    # Blocking file I/O from an async function. The download loop reads and
    # writes pieces on the event loop on purpose: the writes are small, ordered,
    # and share the resume ledger's lock, so moving them to threads is a separate
    # change with its own ordering questions. Selecting these without that change
    # would leave ~50 findings and no owner for any of them.
    "ASYNC230",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use throwaway credentials, /tmp paths, subprocesses and weak
# digests on purpose; none of those is a secret or a shipped default.
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "S108",
    "S324",
    "S603",
    "S604",
    "ASYNC109",
    "ASYNC110",
]

[tool.mypy]
python_version = "3.11"
# Tests are type-checked too: three test doubles kept the old `probe_metadata`
# signature after the probe grew a keyword argument, which running the suite
# could not reveal until the call site was reached.
files = ["src/downctl", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["downctl.*"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Test bodies are mostly fixtures and assertions; demanding an annotation on
# every ``def _helper(tmp_path)`` adds noise without adding a check. The *calls*
# they make are still verified, which is what catches signature drift.
module = ["tests.*"]
# Tests are checked for *calling the product correctly* (wrong keyword, wrong
# assignment, bad import), which is where a renamed parameter or a changed
# return type shows up. What they are not checked for is their own deliberately
# dynamic style: fixtures without annotations, monkeypatching a module attribute,
# and ``dict`` without parameters. Listed explicitly so the gap is a decision
# rather than an accident.
#
# ``arg-type`` is *not* in this list: every structural double now satisfies the
# protocol it is passed to (``FakeTransport``/``RecordingReporter`` carry plugin
# metadata, ``probe``/``policy_request`` accept the narrow ``HTTPSession``
# protocol, and the two keyword-table tests use typed tables rather than
# ``dict[str, object]`` splats). A regression there fails ``mypy``.
disable_error_code = [
    "no-untyped-def",
    "attr-defined",
    "type-arg",
    "type-var",
    "union-attr",
    "no-any-return",
    "unused-ignore",
    "misc",
    "name-defined",
    "func-returns-value",
    "exit-return",
    "call-overload",
]

[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*", "asyncssh", "asyncssh.*", "argcomplete", "argcomplete.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# A regression in the stall watchdog (or an unbounded retry) must fail fast
# with a clear message instead of hanging the whole CI matrix.
timeout = 120

[tool.coverage.run]
source = ["downctl"]
branch = true
# Measure the real `python -m downctl` child processes the CLI tests start, so
# `__main__.py` (the documented entry point) is not permanently at 0%.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
# The three state-machine modules carry a stricter, per-module gate; run
# `coverage report --include="*/core/engine.py" --fail-under=95` (see CI).
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
