[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downctl"
version = "0.1.0"
description = "A plugin-based universal command-line downloader with resumable, multi-connection accelerated and self-healing downloads."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ThzxxArt" }]
keywords = [
    "downloader",
    "cli",
    "resume",
    "async",
    "aiohttp",
    "huggingface",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "aioresponses>=0.7",
    "mypy>=1.10",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/ThzxxArt/downctl"
Documentation = "https://github.com/ThzxxArt/downctl#readme"
Repository = "https://github.com/ThzxxArt/downctl"
Issues = "https://github.com/ThzxxArt/downctl/issues"
Changelog = "https://github.com/ThzxxArt/downctl/blob/main/CHANGELOG.md"

[project.scripts]
downctl = "downctl.cli:main"

[project.entry-points."downctl.sources"]
url = "downctl.builtin.sources.url_source:URLSource"
huggingface = "downctl.builtin.sources.huggingface_source:HuggingFaceSource"
github = "downctl.builtin.sources.github_source:GitHubSource"

[project.entry-points."downctl.transports"]
http = "downctl.builtin.transports.http_transport:HTTPTransport"

[project.entry-points."downctl.verifiers"]
sha256 = "downctl.builtin.verifiers.sha256_verifier:SHA256Verifier"

[project.entry-points."downctl.sinks"]
filesystem = "downctl.builtin.sinks.filesystem_sink:FilesystemSink"

[project.entry-points."downctl.reporters"]
tqdm = "downctl.builtin.reporters.tqdm_reporter:TqdmReporter"
json = "downctl.builtin.reporters.json_reporter:JSONReporter"
quiet = "downctl.builtin.reporters.quiet_reporter:QuietReporter"

[project.entry-points."downctl.routers"]
mirror = "downctl.builtin.routers.mirror_router:MirrorRouter"

[project.entry-points."downctl.hooks"]
logfile = "downctl.builtin.hooks.logfile_hook:LogfileHook"

[tool.hatch.version]
path = "src/downctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/downctl"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["hf-download.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["downctl"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["downctl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
