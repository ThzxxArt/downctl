[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downctl"
dynamic = ["version"]
description = "A plugin-based universal command-line downloader with resumable, multi-connection accelerated and self-healing downloads."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ThzxxArt" }]
keywords = [
    "downloader",
    "cli",
    "resume",
    "async",
    "aiohttp",
    "huggingface",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
sftp = [
    "asyncssh>=2.14",
]
completion = [
    "argcomplete>=3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # `[tool.coverage.run] patch = ["subprocess"]` merges child-process data
    # into a branch-measured parent. pytest-cov 5 hands the child a
    # statement-only configuration, so `pytest --cov` dies with
    # "Can't combine statement coverage data with branch data" (reproduced).
    "pytest-cov>=6",
    "pytest-timeout>=2",
    "mypy>=1.10",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "genbadge[coverage]>=1.1",
]

[project.urls]
Homepage = "https://github.com/ThzxxArt/downctl"
Documentation = "https://github.com/ThzxxArt/downctl#readme"
Repository = "https://github.com/ThzxxArt/downctl"
Issues = "https://github.com/ThzxxArt/downctl/issues"
Changelog = "https://github.com/ThzxxArt/downctl/blob/master/CHANGELOG.md"

[project.scripts]
downctl = "downctl.cli:main"

[project.entry-points."downctl.sources"]
url = "downctl.builtin.sources.url_source:URLSource"
huggingface = "downctl.builtin.sources.huggingface_source:HuggingFaceSource"
github = "downctl.builtin.sources.github_source:GitHubSource"
s3 = "downctl.builtin.sources.s3_source:S3Source"
sftp = "downctl.builtin.sources.sftp_source:SFTPSource"
file = "downctl.builtin.sources.file_source:FileSource"

[project.entry-points."downctl.transports"]
http = "downctl.builtin.transports.http_transport:HTTPTransport"
sftp = "downctl.builtin.transports.sftp_transport:SFTPTransport"
file = "downctl.builtin.transports.file_transport:FileTransport"

[project.entry-points."downctl.verifiers"]
sha256 = "downctl.builtin.verifiers.sha256_verifier:SHA256Verifier"
sha1 = "downctl.builtin.verifiers.digest_verifier:SHA1Verifier"
sha512 = "downctl.builtin.verifiers.digest_verifier:SHA512Verifier"
md5 = "downctl.builtin.verifiers.digest_verifier:MD5Verifier"

[project.entry-points."downctl.reporters"]
tqdm = "downctl.builtin.reporters.tqdm_reporter:TqdmReporter"
json = "downctl.builtin.reporters.json_reporter:JSONReporter"
quiet = "downctl.builtin.reporters.quiet_reporter:QuietReporter"

[project.entry-points."downctl.routers"]
mirror = "downctl.builtin.routers.mirror_router:MirrorRouter"

[project.entry-points."downctl.hooks"]
logfile = "downctl.builtin.hooks.logfile_hook:LogfileHook"
archive = "downctl.builtin.hooks.archive_hook:ArchiveHook"
webhook = "downctl.builtin.hooks.webhook_hook:WebhookHook"
manifest = "downctl.builtin.hooks.manifest_hook:ManifestHook"
exec = "downctl.builtin.hooks.exec_hook:ExecHook"
checksum = "downctl.builtin.hooks.checksum_hook:ChecksumHook"

[tool.hatch.version]
path = "src/downctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/downctl"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/README.en.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["downctl"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*", "asyncssh", "asyncssh.*", "argcomplete", "argcomplete.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# A regression in the stall watchdog (or an unbounded retry) must fail fast
# with a clear message instead of hanging the whole CI matrix.
timeout = 120

[tool.coverage.run]
source = ["downctl"]
branch = true
# Measure the real `python -m downctl` child processes the CLI tests start, so
# `__main__.py` (the documented entry point) is not permanently at 0%.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
# The three state-machine modules carry a stricter, per-module gate; run
# `coverage report --include="*/core/engine.py" --fail-under=95` (see CI).
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
