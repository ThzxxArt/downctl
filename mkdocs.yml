site_name: downctl
site_description: A plugin-based universal command-line downloader.
site_url: https://thzxxart.github.io/downctl/
repo_url: https://github.com/ThzxxArt/downctl
repo_name: ThzxxArt/downctl
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Upgrading: upgrading.md
  - CLI reference: cli.md
  - Sources: sources.md
  - Configuration: configuration.md
  - Hooks: hooks.md
  - Plugins: plugins.md
  - Troubleshooting: troubleshooting.md
  - Cookbook: cookbook.md
  - Design: design.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Upgrading: 升级
            CLI reference: 命令行参考
            Sources: 下载源
            Configuration: 配置
            Hooks: 钩子
            Plugins: 插件开发
            Troubleshooting: 故障排查
            Cookbook: 实战配方
            Design: 设计文档
