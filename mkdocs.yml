site_name: downctl
site_description: A plugin-based universal command-line downloader.
site_url: https://thzxxart.github.io/downctl/
repo_url: https://github.com/ThzxxArt/downctl
repo_name: ThzxxArt/downctl
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - CLI reference: cli.md
  - Plugins: plugins.md
  - Design: design.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            CLI reference: 命令行参考
            Plugins: 插件开发
            Design: 设计文档
